<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Hexodus — tap hexagonal tiles in the right order and let each arrow escape. 100 validated Journey levels, a daily challenge, Zen and Classic modes. Play free in your browser or download for macOS, Windows and Linux." />
    <meta name="theme-color" content="#0b1020" />
    <meta property="og:title" content="Hexodus — a hexagonal escape puzzle" />
    <meta property="og:description" content="Clear every ray. One hundred validated hex puzzles, free in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hexodus.littlejoyarcade.site/" />
    <title>Hexodus</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; }
      body { -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
      #game canvas { display: block; margin: 0 auto; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/phaser/main.js"></script>
    <script src="./arcade-client.js" data-game-id="hexodus"></script>

</html>
